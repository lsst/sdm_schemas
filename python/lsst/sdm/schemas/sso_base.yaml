- name: SSSource
  description: 'Solar System source measurements: one row per Rubin observation submitted to and accepted by the
    MPC (obs_sbn), with the measurement it was submitted from (a DiaSource or a Source, see measuredOn) and its
    ephemeris from mpc_orbits. Built from the record of submitted measurements, independent of the PPDB DiaSource
    table (RFC-1188).'
  tap:table_index: 120
  primaryKey: '#SSSource.obsid'
  columns:
  - name: obsid
    description: 'MPC''s unique identifier of the observation (obs_sbn.obsid): the obs_sbn row this SSSource row
      is. The primary key.'
    datatype: char
    length: 32
    nullable: false
    ivoa:ucd: meta.id;meta.main
  - name: trksub
    description: Observer-assigned tracklet identifier, as submitted (obs_sbn.trksub).
    datatype: char
    length: 8
    ivoa:ucd: meta.id
  - name: trkid
    description: MPC-assigned tracklet identifier (obs_sbn.trkid).
    datatype: char
    length: 16
    ivoa:ucd: meta.id
  - name: submission_id
    description: Identifier of the MPC submission this observation arrived in (obs_sbn.submission_id).
    datatype: char
    length: 32
    ivoa:ucd: meta.id
  - name: status
    description: 'MPC status of the observation (obs_sbn.status). ''I'' marks observations in the Isolated Tracklet
      File: accepted as valid, but not identified with a known object.'
    datatype: char
    length: 1
    nullable: false
    ivoa:ucd: meta.code.status
  - name: primary
    description: 'True on exactly one row per measurement (processing, diaSourceId/sourceId): the ''-A'' row of
      a trail pair, else the row from the earliest submission. A measurement submitted more than once has several
      rows; count only primary rows when counting detections.'
    datatype: boolean
    nullable: false
    ivoa:ucd: meta.code
  - name: matchMethod
    description: 'How the measurement this observation was submitted from was found: ''obssubid'' (its obsSubID,
      LSST-<processing>-<id> or a bare id, looked up and verified by position and time), ''obssubid_trail'' (a trailed
      source submitted as two obs_sbn rows, ''-A'' and ''-B'', one per trail end, verified at their midpoint) or
      ''position'' (a position and time search, where the obsSubID didn''t parse or verify).'
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.code
  - name: ssObjectId
    description: 'Unique LSST identifier of the Solar System object (SSObject.ssObjectId). NULL when this observation
      is not identified with an object that has an SSObject row: Isolated Tracklet File observations (status ''I''),
      and designated objects missing from mpc_orbits.'
    datatype: long
    ivoa:ucd: meta.id;src
  - name: designation
    description: The unpacked primary provisional designation of the object the MPC identified this observation
      with; NULL if none.
    datatype: char
    length: 16
    ivoa:ucd: meta.id;src
  - name: measuredOn
    description: 'Kind of image the row was measured on: ''difference'' for DiaSource rows, ''science'' for Source
      rows.'
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.code
  - name: processing
    description: 'Processing label, e.g. AP-DS, pDP2-DS or NV-S: which (re)processing the row belongs to. (processing,
      id) is the key, and obsSubID is LSST-<processing>-<id>. Named collection in v1.'
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.id
  - name: processingTable
    description: Fully qualified ssp table the row came from, e.g. ssp.dia_source_ppdb_rel2; provenance runs from
      there to the table's ingest YAML and acid manifests.
    datatype: char
    length: 32
    nullable: false
    ivoa:ucd: meta.ref
  - name: diaSourceId
    description: Identifier of the DiaSource this observation was measured as (DiaSource.diaSourceId in its processing);
      NULL on Source rows (measuredOn = 'science').
    datatype: long
    ivoa:ucd: meta.id;obs.image
  - name: sourceId
    description: Identifier of the Source this observation was measured as (Source.sourceId in its processing);
      NULL on DiaSource rows (measuredOn = 'difference').
    datatype: long
    ivoa:ucd: meta.id;obs.image
  - name: parentDiaSourceId
    description: Id of the parent DiaSource this one was deblended from, if any; NULL on Source rows.
    datatype: long
    ivoa:ucd: meta.id.parent;src
  - name: parentSourceId
    description: Id of the parent Source this one was deblended from, if any; NULL on DiaSource rows.
    datatype: long
    ivoa:ucd: meta.id.parent;src
  - name: visit
    description: Visit id. DiaSource visit; Source visit.
    datatype: long
    nullable: false
    ivoa:ucd: meta.id;obs.image
  - name: detector
    description: Detector id. DiaSource detector; Source detector.
    datatype: short
    nullable: false
    ivoa:ucd: meta.id;obs.image
  - name: midpointMjdTai
    description: Exposure midpoint of this source, TAI MJD, corrected for the shutter's motion across the focal plane
      (the corrected time differs from the visit's midpoint by up to ~0.24 s, depending on the source's position).
      Where no correction is available it is the visit's midpoint (the DiaSource's midpointMjdTai, or on Source rows
      the visit's exposure midpoint), and midpointMjdTai_flag is set. The ephemeris columns are computed at this
      time. Named mjd_tai in v1.
    datatype: double
    nullable: false
    ivoa:unit: d
    ivoa:ucd: time.epoch
  - name: midpointMjdTai_flag
    description: True when midpointMjdTai is the visit's midpoint, not corrected for the shutter's motion (no
      correction is available for this visit or position).
    datatype: boolean
    nullable: false
  - name: midpointMjdTai_flag_degraded
    description: True when midpointMjdTai is corrected for the shutter's motion, but with reduced accuracy.
    datatype: boolean
    nullable: false
  - name: exposureTime
    description: 'Measured exposure (shutter-open) time of the visit, s: ConsDB exposure.shut_time (= Butler visitInfo.exposureTime),
      looked up by visit in ssp.visit_exposure on every branch. NULL where ConsDB has no value or the table lacks
      the visit; never the requested or nominal time.'
    datatype: float
    ivoa:unit: s
    ivoa:ucd: time.interval
  - name: ra
    description: 'Right ascension of the centroid, degrees. DiaSource ra; Source ra (AP-S: coord_ra).'
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.eq.ra
  - name: raErr
    description: 'Uncertainty of ra (of RA*cos(Dec)), degrees. DiaSource raErr; Source raErr (AP-S: coord_raErr).'
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.ra
  - name: dec
    description: 'Declination of the centroid, degrees. DiaSource dec; Source dec (AP-S: coord_dec).'
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.eq.dec
  - name: decErr
    description: 'Uncertainty of dec, degrees. DiaSource decErr; Source decErr (AP-S: coord_decErr).'
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.dec
  - name: ra_dec_Cov
    description: 'Covariance of ra (RA*cos(Dec)) and dec, degrees^2. DiaSource ra_dec_Cov; Source ra_dec_Cov (AP-S:
      coord_ra_dec_Cov). NULL on 001-DS.'
    datatype: float
    ivoa:unit: deg**2
    ivoa:ucd: stat.covariance
  - name: x
    description: 'Centroid x on the detector, pixels. DiaSource x; Source x (AP-S: slot_Centroid_x).'
    datatype: float
    ivoa:unit: pixel
    ivoa:ucd: pos.cartesian.x
  - name: xErr
    description: 'Uncertainty of x, pixels. DiaSource xErr; Source xErr (AP-S: slot_Centroid_xErr).'
    datatype: float
    ivoa:unit: pixel
    ivoa:ucd: stat.error;pos.cartesian.x
  - name: y
    description: 'Centroid y on the detector, pixels. DiaSource y; Source y (AP-S: slot_Centroid_y).'
    datatype: float
    ivoa:unit: pixel
    ivoa:ucd: pos.cartesian.y
  - name: yErr
    description: 'Uncertainty of y, pixels. DiaSource yErr; Source yErr (AP-S: slot_Centroid_yErr).'
    datatype: float
    ivoa:unit: pixel
    ivoa:ucd: stat.error;pos.cartesian.y
  - name: centroid_flag
    description: 'General centroid failure flag. DiaSource centroid_flag; Source centroid_flag (AP-S: slot_Centroid_flag).'
    datatype: boolean
  - name: apFlux
    description: 'Flux in the 12 pixel (2.4 arcsec) radius circular aperture, nJy, not aperture-corrected. DiaSource
      apFlux (difference image); Source ap12Flux (AP-S: base_CircularApertureFlux_12_0_instFlux calibrated with
      base_LocalPhotoCalib).'
    datatype: float
    ivoa:unit: nJy
    ivoa:ucd: phot.count
  - name: apFluxErr
    description: 'Uncertainty of apFlux, nJy. DiaSource apFluxErr; Source ap12FluxErr (AP-S: calibrated in full
      quadrature with base_LocalPhotoCalibErr).'
    datatype: float
    ivoa:unit: nJy
    ivoa:ucd: stat.error;phot.count
  - name: apMag
    description: 'AB magnitude of apFlux: 31.4 - 2.5*log10(apFlux/nJy), NULL when apFlux <= 0; computed on read,
      never stored. DiaSource (ppdb) apMag; Source ap12Mag.'
    datatype: float
    ivoa:unit: mag
    ivoa:ucd: phot.mag
  - name: apMagErr
    description: 'Uncertainty of apMag: 1.0857*apFluxErr/apFlux, NULL when apFlux <= 0; computed on read. DiaSource
      (ppdb) apMagErr; Source ap12MagErr.'
    datatype: float
    ivoa:unit: mag
    ivoa:ucd: stat.error;phot.mag
  - name: apFlux_flag
    description: 'Failure flag of the 12 px aperture flux. DiaSource apFlux_flag; Source ap12Flux_flag (AP-S: base_CircularApertureFlux_12_0_flag).'
    datatype: boolean
  - name: apFlux_flag_apertureTruncated
    description: 'The 12 px aperture did not fit within the image. DiaSource apFlux_flag_apertureTruncated; Source
      apFlux_12_0_flag_apertureTruncated (AP-S: base_CircularApertureFlux_12_0_flag_apertureTruncated).'
    datatype: boolean
  - name: ap03Flux
    description: 'Flux in the 3 pixel (0.6 arcsec) radius circular aperture, nJy, not aperture-corrected. Source
      ap03Flux (AP-S: base_CircularApertureFlux_3_0_instFlux calibrated with base_LocalPhotoCalib). Source-only
      extra: DiaSource measures only the 12 px aperture, so NULL on DiaSource rows.'
    datatype: float
    ivoa:unit: nJy
    ivoa:ucd: phot.flux
  - name: ap03FluxErr
