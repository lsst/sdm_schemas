    description: 'Source center is off image. DiaSource pixelFlags_offimage; Source pixelFlags_offimage (AP-S: base_PixelFlags_flag_offimage).'
    datatype: boolean
  - name: pixelFlags_saturated
    description: 'Saturated pixel in the footprint. DiaSource pixelFlags_saturated; Source pixelFlags_saturated
      (AP-S: base_PixelFlags_flag_saturated).'
    datatype: boolean
  - name: pixelFlags_saturatedCenter
    description: 'Saturated pixel in the 3x3 region around the centroid. DiaSource pixelFlags_saturatedCenter; Source
      pixelFlags_saturatedCenter (AP-S: base_PixelFlags_flag_saturatedCenter).'
    datatype: boolean
  - name: pixelFlags_suspect
    description: 'Suspect pixel in the footprint. DiaSource pixelFlags_suspect; Source pixelFlags_suspect (AP-S:
      base_PixelFlags_flag_suspect).'
    datatype: boolean
  - name: pixelFlags_suspectCenter
    description: 'Suspect pixel in the 3x3 region around the centroid. DiaSource pixelFlags_suspectCenter; Source
      pixelFlags_suspectCenter (AP-S: base_PixelFlags_flag_suspectCenter).'
    datatype: boolean
  - name: pixelFlags_streak
    description: Streak in the footprint. DiaSource pixelFlags_streak; no Source equivalent.
    datatype: boolean
  - name: pixelFlags_streakCenter
    description: Streak in the 3x3 region around the centroid. DiaSource pixelFlags_streakCenter; no Source equivalent.
    datatype: boolean
  - name: pixelFlags_injected
    description: Injection in the footprint. DiaSource pixelFlags_injected; no Source equivalent.
    datatype: boolean
  - name: pixelFlags_injectedCenter
    description: Injection in the 3x3 region around the centroid. DiaSource pixelFlags_injectedCenter; no Source
      equivalent.
    datatype: boolean
  - name: pixelFlags_injected_template
    description: Template injection in the footprint. DiaSource pixelFlags_injected_template; no Source equivalent.
    datatype: boolean
  - name: pixelFlags_injected_templateCenter
    description: Template injection in the 3x3 region around the centroid. DiaSource pixelFlags_injected_templateCenter;
      no Source equivalent.
    datatype: boolean
  - name: glint_trail
    description: Part of a satellite glint trail. DiaSource glint_trail (DP2 and PPDB tables; prompt eras from 20250905);
      no Source equivalent.
    datatype: boolean
  - name: eclLambda
    description: Ecliptic longitude, converted from the observed coordinates.
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.ecliptic.lon
  - name: eclBeta
    description: Ecliptic latitude, converted from the observed coordinates.
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.ecliptic.lat
  - name: galLon
    description: Galactic longitude, converted from the observed coordinates.
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.galactic.lon
  - name: galLat
    description: Galactic latitude, converted from the observed coordinates.
    datatype: double
    nullable: false
    ivoa:unit: deg
    ivoa:ucd: pos.galactic.lat
  - name: elongation
    description: Solar elongation of the object at the time of observation.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.phaseAng
  - name: phaseAngle
    description: Phase angle between the Sun, object, and observer.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.phaseAng
  - name: topoRange
    description: Topocentric distance (delta) at light-emission time.
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.distance
  - name: topoRangeRate
    description: Topocentric radial (line-of-sight) velocity (deldot); positive values indicate motion away from
      the observer.
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc
  - name: helioRange
    description: Heliocentric distance (r) at light-emission time.
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.distance;pos.heliocentric
  - name: helioRangeRate
    description: Heliocentric radial velocity (rdot); positive values indicate motion away from the Sun.
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.heliocentric
  - name: ephRa
    description: Predicted ICRS right ascension from the orbit in mpc_orbits.
    datatype: double
    ivoa:unit: deg
    ivoa:ucd: pos.eq.ra;meta.modelled;pos.ephem
  - name: ephRaErr
    description: 1-sigma uncertainty of ephRa (on the sky, i.e. including the cos(dec) factor), propagated from
      the mpc_orbits covariance.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.ra;pos.ephem
  - name: ephDec
    description: Predicted ICRS declination from the orbit in mpc_orbits.
    datatype: double
    ivoa:unit: deg
    ivoa:ucd: pos.eq.dec;meta.modelled;pos.ephem
  - name: ephDecErr
    description: 1-sigma uncertainty of ephDec, propagated from the mpc_orbits covariance.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.dec;pos.ephem
  - name: ephRa_ephDec_Cov
    description: Covariance between ephRa (on the sky) and ephDec; with ephRaErr and ephDecErr, the predicted position's
      error ellipse, in the convention of raErr, decErr and ra_dec_Cov.
    datatype: float
    ivoa:unit: deg**2
    ivoa:ucd: stat.covariance;pos.eq;pos.ephem
  - name: ephVmag
    description: 'Predicted magnitude in V band, computed from mpc_orbits data including the mpc_orbits-provided
      (H, G) estimates

      '
    datatype: float
    ivoa:unit: mag
    ivoa:ucd: phot.mag;em.opt.V
  - name: ephRate
    description: Total predicted on-sky angular rate of motion.
    datatype: float
    ivoa:unit: deg/d
    ivoa:ucd: pos.pm;pos.ephem
  - name: ephRateRa
    description: Predicted on-sky angular rate in the R.A. direction (includes the cos(dec) factor).
    datatype: float
    ivoa:unit: deg/d
    ivoa:ucd: pos.pm;pos.eq.ra;pos.ephem
  - name: ephRateDec
    description: Predicted on-sky angular rate in the declination direction.
    datatype: float
    ivoa:unit: deg/d
    ivoa:ucd: pos.pm;pos.eq.dec;pos.ephem
  - name: ephAntiSunPA
    description: Predicted position angle of the extended Sun-to-object radius vector (the anti-Sun direction, along which an ion tail points), projected on the sky at the object and measured from ICRS north through east, in [0, 360). As JPL Horizons' PsAng, but relative to the ICRS pole; from the light-emission-time heliocentric vector (helio_x, helio_y, helio_z). Ill-conditioned near zero phase angle.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.posAng;pos.ephem
  - name: ephAntiMotionPA
    description: Predicted position angle of the negative of the object's heliocentric velocity vector (the direction a dust trail lags towards), projected on the sky at the object and measured from ICRS north through east, in [0, 360). As JPL Horizons' PsAMV, but relative to the ICRS pole; from the light-emission-time heliocentric velocity (helio_vx, helio_vy, helio_vz).
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.posAng;pos.ephem
  - name: ephOffset
    description: Total observed versus predicted angular separation on the sky.
    datatype: float
    ivoa:unit: arcsec
    ivoa:ucd: pos.angDistance;stat.fit.omc
  - name: ephOffsetRa
    description: Offset between observed and predicted position in the R.A. direction (includes cos(dec) term).
    datatype: double
    ivoa:unit: arcsec
    ivoa:ucd: pos.eq.ra;stat.fit.omc
  - name: ephOffsetDec
    description: Offset between observed and predicted position in declination.
    datatype: double
    ivoa:unit: arcsec
    ivoa:ucd: pos.eq.dec;stat.fit.omc
  - name: ephOffsetAlongTrack
    description: Offset between observed and predicted position in the along-track direction on the sky.
    datatype: float
    ivoa:unit: arcsec
    ivoa:ucd: pos.angDistance;stat.fit.omc
  - name: ephOffsetCrossTrack
    description: Offset between observed and predicted position in the cross-track direction on the sky.
    datatype: float
    ivoa:unit: arcsec
    ivoa:ucd: pos.angDistance;stat.fit.omc
  - name: helio_x
    description: Cartesian heliocentric X coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.x;pos.heliocentric
  - name: helio_y
    description: Cartesian heliocentric Y coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.y;pos.heliocentric
  - name: helio_z
    description: Cartesian heliocentric Z coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.z;pos.heliocentric
  - name: helio_vx
    description: Cartesian heliocentric X velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.x
  - name: helio_vy
    description: Cartesian heliocentric Y velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.y
  - name: helio_vz
    description: Cartesian heliocentric Z velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.z
  - name: helio_vtot
    description: The magnitude of the heliocentric velocity vector, sqrt(vx*vx + vy*vy + vz*vz).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.heliocentric
  - name: topo_x
    description: Cartesian topocentric X coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.x
  - name: topo_y
    description: Cartesian topocentric Y coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.y
  - name: topo_z
    description: Cartesian topocentric Z coordinate at light-emission time (ICRS).
    datatype: float
    ivoa:unit: AU
    ivoa:ucd: pos.cartesian.z
  - name: topo_vx
    description: Cartesian topocentric X velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.x
  - name: topo_vy
    description: Cartesian topocentric Y velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.y
  - name: topo_vz
    description: Cartesian topocentric Z velocity at light-emission time (ICRS).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc;pos.cartesian.z
  - name: topo_vtot
    description: The magnitude of the topocentric velocity vector, sqrt(vx*vx + vy*vy + vz*vz).
    datatype: float
    ivoa:unit: km/s
    ivoa:ucd: phys.veloc
- name: NearbySSO
  description: For each DiaSource, the nearest known Solar System object whose predicted position (from mpc_orbits)
    is within the object's matching radius (5 arcsec; 15 arcsec for comets and interstellar objects, i.e. designations
    starting C/, P/, D/ or I/), and whose predicted 1-sigma uncertainty is small enough for the association to
    be meaningful. Regenerated daily (RFC-1188).
  tap:table_index: 125
  primaryKey: '#NearbySSO.diaSourceId'
  columns:
  - name: diaSourceId
    description: Unique identifier of the DiaSource.
    datatype: long
    nullable: false
    ivoa:ucd: meta.id;obs.image
  - name: ssObjectId
    description: Id of the SSObject found within a matching radius of this source, if any; NULL if the object has
      no SSObject row.
    datatype: long
    ivoa:ucd: meta.id;src
  - name: designation
    description: The primary provisional designation in unpacked form (e.g. 2008 AB).
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.id;src
  - name: ephRa
    description: Predicted ICRS right ascension from the orbit in mpc_orbits.
    datatype: double
    ivoa:unit: deg
    ivoa:ucd: pos.eq.ra;meta.modelled;pos.ephem
  - name: ephRaErr
    description: 1-sigma uncertainty of ephRa (on the sky, i.e. including the cos(dec) factor), propagated from
      the mpc_orbits covariance.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.ra;pos.ephem
  - name: ephDec
    description: Predicted ICRS declination from the orbit in mpc_orbits.
    datatype: double
    ivoa:unit: deg
    ivoa:ucd: pos.eq.dec;meta.modelled;pos.ephem
  - name: ephDecErr
    description: 1-sigma uncertainty of ephDec, propagated from the mpc_orbits covariance.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: stat.error;pos.eq.dec;pos.ephem
  - name: ephRa_ephDec_Cov
    description: Covariance between ephRa (on the sky) and ephDec; with ephRaErr and ephDecErr, the predicted position's
      error ellipse, in the convention of raErr, decErr and ra_dec_Cov.
    datatype: float
    ivoa:unit: deg**2
    ivoa:ucd: stat.covariance;pos.eq;pos.ephem
  - name: ephOffset
    description: Total observed versus predicted angular separation on the sky.
    datatype: float
    ivoa:unit: arcsec
    ivoa:ucd: pos.angDistance;stat.fit.omc
  - name: diaDistanceRank
    description: 'Rank of this DiaSource by its separation from the object''s predicted position, among all DiaSources
      of the same visit within the object''s matching radius of that prediction: 1 for the nearest, 2 for the next, and so
      on (ties broken by the lower diaSourceId). A rank above 1 means a closer DiaSource exists, which may be attributed
      to another object.'
    datatype: short
    nullable: false
    ivoa:ucd: meta.number
  - name: ephVmag
    description: Predicted magnitude in V band, computed from mpc_orbits data including the mpc_orbits-provided
      (H, G) estimates.
    datatype: float
    ivoa:unit: mag
    ivoa:ucd: phot.mag;em.opt.V
  - name: ephRateRa
    description: Predicted on-sky angular rate in the R.A. direction (includes the cos(dec) factor).
    datatype: float
    ivoa:unit: deg/d
    ivoa:ucd: pos.pm;pos.eq.ra;pos.ephem
  - name: ephRateDec
    description: Predicted on-sky angular rate in the declination direction.
    datatype: float
    ivoa:unit: deg/d
    ivoa:ucd: pos.pm;pos.eq.dec;pos.ephem
  - name: ephAntiSunPA
    description: Predicted position angle of the extended Sun-to-object radius vector (the anti-Sun direction, along which an ion tail points), projected on the sky at the object and measured from ICRS north through east, in [0, 360). As JPL Horizons' PsAng, but relative to the ICRS pole; from the light-emission-time heliocentric vector (helio_x, helio_y, helio_z). Ill-conditioned near zero phase angle.
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.posAng;pos.ephem
  - name: ephAntiMotionPA
    description: Predicted position angle of the negative of the object's heliocentric velocity vector (the direction a dust trail lags towards), projected on the sky at the object and measured from ICRS north through east, in [0, 360). As JPL Horizons' PsAMV, but relative to the ICRS pole; from the light-emission-time heliocentric velocity (helio_vx, helio_vy, helio_vz).
    datatype: float
    ivoa:unit: deg
    ivoa:ucd: pos.posAng;pos.ephem

- name: mpc_orbits
  description: Table of orbital elements and related information of known (sun-orbiting and unbound) Solar
    System objects. Replicated from the Minor Planet Center (Postgres) database. This schema will
    generally closely follow the schema of the upstream table, to allow end-users to rerun queries
    developed elsewhere on the RSP.
  tap:table_index: 130
  primaryKey: '#mpc_orbits.id'
  columns:
  - name: id
    description: Internal ID (generally not seen/used by the user)
    datatype: int
    nullable: false
    ivoa:ucd: meta.id;src
  - name: designation
    # Note: the 'designation' column is a Rubin-provided copy of the
    # unpacked_primary_provisional_designation column to work around UX issues.
    description: The primary provisional designation in unpacked form (e.g. 2008 AB).
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.id;src
  - name: packed_primary_provisional_designation
    description: The primary provisional designation in packed form (e.g. K08A00B)
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.id;src
  - name: unpacked_primary_provisional_designation
    description: The primary provisional designation in unpacked form (e.g. 2008 AB)
    datatype: char
    length: 16
    nullable: false
    ivoa:ucd: meta.id;src
  - name: mpc_orb_jsonb
    description: Details of the orbit solution in JSON form
    datatype: text
  - name: created_at
    description: When this row was created
    datatype: timestamp
    precision: 6
    ivoa:ucd: time.creation;meta.dataset
  - name: updated_at
    description: When this row was updated
