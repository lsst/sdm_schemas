    datatype: float
    ivoa:ucd: stat.fit.param
  - name: u_G12Err
    description: Error in the estimate of G12 (u band).
    datatype: float
    ivoa:ucd: stat.error;stat.fit.param
  - name: u_H_u_G12_Cov
