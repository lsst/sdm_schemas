  - name: a2_unc
    description: "Uncertainty on A2 non-grav components [m^2/ton]"
    datatype: double
    ivoa:unit: m2.t-1
  - name: a3_unc
    description: "Uncertainty on A3 non-grav components [m^2/ton]"
    datatype: double
    ivoa:unit: m2.t-1
  - name: dt_unc
