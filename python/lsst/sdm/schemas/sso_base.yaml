  - name: peri_time
    description: "Time from Pericenter Passage [days]"
    datatype: double
    ivoa:unit: d
  - name: yarkovsky
    description: "Yarkovsky Component [10^(-10)*au/day^2]"
    datatype: double
    ivoa:unit: 1e-10.au.d-2
  - name: srp
